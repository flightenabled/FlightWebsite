<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Flight Enabled mark v8 — same fat four-blade + Earth-ring as vector-v4 / X avatar.
       Symmetric-difference (evenodd) of the two crossed ellipses = four blades + transparent center.
       No white/black fill in center. No capsule plate. -->
  <defs>
    <clipPath id="inside-ring">
      <circle cx="100" cy="100" r="95"/>
    </clipPath>
  </defs>
  <g clip-path="url(#inside-ring)">
    <!-- Vertical ellipse rx=27.5 ry=89.3 + horizontal ellipse rx=89.3 ry=27.5;
         evenodd punches the intersection (center) to transparent. -->
    <path fill="#376B28" fill-rule="evenodd" clip-rule="evenodd"
      d="M 100,10.7 A 27.5,89.3 0 1 0 100,189.3 A 27.5,89.3 0 1 0 100,10.7 Z
         M 10.7,100 A 89.3,27.5 0 1 0 189.3,100 A 89.3,27.5 0 1 0 10.7,100 Z"/>
  </g>
  <circle cx="100" cy="100" r="97.9" fill="none" stroke="#2E6AAE" stroke-width="5.8"/>
</svg>
